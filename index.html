<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3b5442" />
    <script>
      // Apply the saved theme + accent before first paint to avoid a light flash in dark mode.
      try {
        var t = localStorage.getItem('theme') || 'light'
        var a = localStorage.getItem('accent') || 'green'
        var known = ['green', 'maroon', 'navy', 'magenta', 'brown']
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light')
        document.documentElement.setAttribute('data-accent', known.indexOf(a) >= 0 ? a : 'green')
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..700&display=swap"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>AdraConnects</title>
    <!-- Open Graph / Facebook / LinkedIn / Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AdraConnects - College Club Management & Communication" />
    <meta property="og:description" content="Agile Development, Robust Automations — a WhatsApp-style college club management & communication cloud web app. Direct messages, club groups, announcements, events, and resources." />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta property="og:url" content="https://adraconnects.vercel.app" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AdraConnects - College Club Management & Communication" />
    <meta name="twitter:description" content="Agile Development, Robust Automations — a WhatsApp-style college club management & communication cloud web app." />
    <meta name="twitter:image" content="/icons/icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
